[package]
name = "aether_runtime"
version = "0.0.1"
edition = "2021"
description = "Rust-owned host runtime for Aether: an embedded Luau guest, driven frame by frame"
license = "MIT"

# THE INVERSION, IN ONE DEPENDENCY LIST.
#
# There is no `ffi`, no `libloading`, and there will not be. This crate owns the
# process and Luau is a GUEST inside it; the guest reaches the outside world only
# through functions this crate injects. A capability model cannot be enforced from
# inside the runtime it is meant to constrain, which is what the zune experiment
# established the expensive way.
[dependencies]
mlua = { version = "0.12", features = ["luau", "send", "serialize"] }

# OPTIONAL, so `painter::Painter` stays free of any backend. A consumer that only
# needs the display list -- a test, a headless diff, a transport -- should not
# compile a rasteriser to get it.
aether_raster = { path = "../raster", optional = true }

[dev-dependencies]
# Reading a written PNG back, so the pixel assertions go through the same writer a
# real snapshot would.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []

# The CPU painter over aether_raster. Deliberately NOT default: it is the first
# implementation of the trait, not a privileged one.
raster = ["dep:aether_raster"]
