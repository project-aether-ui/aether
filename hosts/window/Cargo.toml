[package]
name = "aether_window"
version = "0.0.1"
edition = "2021"
description = "A native window and message pump for Aether's off-engine hosts"
license = "MIT"

# NO RASTERISER AND NO LUAU. This crate opens a window, reports input, and blits
# a buffer of bytes. It does not know what produced them, which is what lets the
# CLI's preview and Dew's widgets share it without sharing anything else.
#
# OPAQUE, DELIBERATELY, AND THAT IS THE POINT OF SHIPPING IT NOW. Per-pixel
# window transparency on Win32 needs DirectComposition and a swapchain with
# premultiplied alpha, which is the one genuinely unresolved question in this
# stack. An ordinary window with a GDI blit needs neither, is what a developer
# previewing a component wants anyway, and is the path the zune host already
# proved. A transparent window becomes another `Surface` impl beside this one
# rather than a rewrite of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
