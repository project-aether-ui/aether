[package]
name = "aether-cli"
version = "0.0.1"
edition = "2021"
description = "The aether developer CLI: render a component to a file, or to a window"
license = "MIT"

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether_runtime = { path = "../runtime", features = ["raster"] }
aether_raster = { path = "../raster" }

# WINDOWS ONLY, and `preview` is compiled out elsewhere rather than stubbed to an
# error at runtime. `snapshot` is the whole CLI on a machine with no display, and
# it is also the half that CI wants — so the portable half must not be held back
# by the half that is not.
[target.'cfg(windows)'.dependencies]
aether_window = { path = "../window" }

# NO ARGUMENT-PARSING CRATE. The surface is two subcommands and four flags, and a
# derive-macro dependency would cost more to compile than the whole binary. When
# this grows a third command with real options, revisit it then rather than now.
