# Everything that can be checked without a Roblox client.
#
# WHAT THIS CANNOT DO, and it is the larger half: the conformance suite has a
# second runner that builds each case inside Studio and reads the engine's own
# layout back. That is the runner whose output is evidence. This one checks that
# our implementation still agrees with what the engine was last observed saying,
# which catches a regression and never catches the engine moving.
#
# So a green run here means "unchanged", not "correct". See conformance/README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push cancels the first. These are long Rust builds and there is no
# value in finishing a run for a commit that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luau:
    name: suites, gates and conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ROKIT, so CI runs the versions rokit.toml pins. A floating lune once
      # moved JSON between modules mid-milestone; matching local exactly is the
      # whole reason that file exists.
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # PESDE IS NOT IN rokit.toml, and cannot be: its releases carry build
      # metadata in the tag and rokit will not resolve them. Pinned to the same
      # version the repository is developed against; see the note in rokit.toml.
      - name: Install pesde
        shell: pwsh
        run: |
          # PWSH, NOT BASH. A bash step writing $HOME/.pesde-bin into
          # GITHUB_PATH writes a POSIX path, which later pwsh steps cannot
          # resolve -- so pesde installed correctly and was still "not
          # recognized" one step later.
          $url = "https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pesde.zip
          Expand-Archive -Path pesde.zip -DestinationPath "$env:RUNNER_TEMP/pesde" -Force
          "$env:RUNNER_TEMP/pesde" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: pesde install
      - run: lune run conformance/syntax_check.luau
      # THE 33 SUITES RUN UNDER DEW (ADR-002).
      #
      # Under ADR-002, LuauDataModel retired to OSS/luau-datamodel/ and Aether
      # hosts nothing of its own. The test suites execute against Dew's native
      # DataModel host via `dew test`, which runs against Dew's runtime VM rather
      # than Lune.
      #
      # What checks this framework in standalone CI: the structural gates and
      # the conformance suite against Roblox.
      - run: lune run tests/gates/all_gates.luau --run
      - run: lune run conformance/run.luau

# THE `rust` AND `fmt` JOBS ARE GONE, AND SO IS THE RUST THEY RAN.
#
# ADR-004: `hosts/raster`, `hosts/runtime` and `hosts/window` were Dew's
# rendering stack living in the framework's repository -- `pesde.toml` ships
# `src/**`, so none of it ever reached a Luau consumer -- and they moved to
# `Dew/crates/` in milestone 2's first sprint. There is no `Cargo.toml` in this
# repository for `cargo test` or `cargo fmt` to find, and a job pointed at one
# would fail on every push.
#
# `tests/gates/verify_framework_boundaries.luau`, which the `luau` job above
# already runs, is what keeps it that way: a stray `.rs` or a new `Cargo.toml`
# anywhere in this tree fails the gate on the commit that adds it.
#
# WHAT WENT WITH THEM, so it is not looked for here later: the `pesde install`
# those two jobs needed (the Rust tests loaded the framework's Luau through an
# embedded VM and resolved vide from `roblox_packages`), and the clippy job that
# was never added -- its own note read "It reports thirty-two warnings today, and
# a job that is red on its first run teaches everyone to ignore the badge.
# Triage them, then add it." Those thirty-two are Dew's to triage now, and are
# named and counted in `Dew/crates/*/Cargo.toml`.
